# Manual build, registry push, and existing-app deployment; no SQL credentials.
trigger: none
pr: none

pool:
  name: mdp-sql-mcp-swc

variables:
  acrLoginServer: crmultillmcontosouniversity-crdsg5h5h5dkb9gm.azurecr.io
  containerAppName: mcp-products
  containerAppResourceGroup: private-apps-rg

jobs:
- job: ValidateBuildEnvironment
  displayName: Build, publish, and deploy private SQL MCP
  timeoutInMinutes: 30
  steps:
  - checkout: self
    fetchDepth: 1
    persistCredentials: false

  - task: Bash@3
    displayName: Check agent tools and Docker daemon
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        for tool in docker az curl python3; do
          command -v "$tool"
        done
        docker version
        az version
        df -h .

  - task: Bash@3
    displayName: Check private ACR DNS and HTTPS access
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        python3 - <<'PY'
        import ipaddress
        import os
        import socket

        hostname = os.environ["ACR_LOGIN_SERVER"]
        addresses = {
            result[4][0]
            for result in socket.getaddrinfo(hostname, 443, type=socket.SOCK_STREAM)
        }
        expected_subnet = ipaddress.ip_network("10.8.2.0/24")
        if not addresses or any(
            ipaddress.ip_address(address) not in expected_subnet
            for address in addresses
        ):
            raise SystemExit(
                f"FAIL: {hostname} must resolve into {expected_subnet}; got {sorted(addresses)}"
            )
        print(f"PASS: ACR private DNS resolves to {sorted(addresses)}")
        PY

        status="$(curl --silent --show-error \
          --connect-timeout 10 --max-time 30 \
          --output /dev/null --write-out '%{http_code}' \
          "https://${ACR_LOGIN_SERVER}/v2/")"
        if [[ "$status" != "401" && "$status" != "200" ]]; then
          printf 'FAIL: ACR endpoint returned HTTP %s\n' "$status" >&2
          exit 1
        fi
        printf 'PASS: ACR HTTPS endpoint reachable (HTTP %s); authentication not tested\n' "$status"
    env:
      ACR_LOGIN_SERVER: $(acrLoginServer)

  - task: Bash@3
    displayName: Build image and validate script syntax
    inputs:
      targetType: inline
      workingDirectory: $(Build.SourcesDirectory)
      script: |
        set -euo pipefail
        bash -n scripts/entrypoint.sh
        bash -n scripts/smoke-test.sh
        docker build --pull --progress=plain \
          --tag "dab-products:ci-${BUILD_BUILDID}-${SYSTEM_JOBATTEMPT}" .

  - task: Bash@3
    displayName: Check built image tools and packaged scripts
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        image="dab-products:ci-${BUILD_BUILDID}-${SYSTEM_JOBATTEMPT}"
        docker run --rm --entrypoint /bin/bash "$image" -c '
          set -euo pipefail
          command -v curl
          printf "%s\n" "{\"ok\":true}" | jq -e ".ok == true"
          test -f /App/Azure.DataApiBuilder.Service.dll
          bash -n /App/scripts/entrypoint.sh
          bash -n /App/scripts/smoke-test.sh
        '

  - task: AzureCLI@2
    displayName: Authenticate and push image to ACR
    inputs:
      azureSubscription: private-apps-rg-sc
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        subscription="$(az account show --query id --output tsv)"
        if [[ "$subscription" != "910ebf13-1058-405d-b6cf-eda03e5288d1" ]]; then
          printf 'FAIL: Unexpected subscription: %s\n' "$subscription" >&2
          exit 1
        fi

        az acr login --name crmultillmcontosouniversity
        printf 'PASS: Service connection authenticated to ACR\n'

        image="dab-products:ci-${BUILD_BUILDID}-${SYSTEM_JOBATTEMPT}"
        published_image="${ACR_LOGIN_SERVER}/${image}"
        docker tag "$image" "$published_image"
        docker push "$published_image"
        printf 'PASS: Published image %s\n' "$published_image"
    env:
      ACR_LOGIN_SERVER: $(acrLoginServer)

  - task: AzureCLI@2
    displayName: Deploy image to ACA and verify SQL startup smoke test
    timeoutInMinutes: 15
    inputs:
      azureSubscription: private-apps-rg-sc
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        image="${ACR_LOGIN_SERVER}/dab-products:ci-${BUILD_BUILDID}-${SYSTEM_JOBATTEMPT}"
        revision_suffix="ci-${BUILD_BUILDID}-${SYSTEM_JOBATTEMPT}"
        revision="${CONTAINER_APP_NAME}--${revision_suffix}"

        az containerapp update \
          --name "$CONTAINER_APP_NAME" \
          --resource-group "$CONTAINER_APP_RESOURCE_GROUP" \
          --container-name "$CONTAINER_APP_NAME" \
          --image "$image" \
          --revision-suffix "$revision_suffix" \
          --output none

        for attempt in {1..60}; do
          health="$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$CONTAINER_APP_RESOURCE_GROUP" \
            --revision "$revision" \
            --query properties.healthState --output tsv)"
          printf 'Revision %s health: %s (attempt %s/60)\n' "$revision" "$health" "$attempt"

          if [[ "$health" == "Healthy" ]]; then
            deployed_image="$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$CONTAINER_APP_RESOURCE_GROUP" \
              --revision "$revision" \
              --query "properties.template.containers[?name=='${CONTAINER_APP_NAME}'].image | [0]" \
              --output tsv)"
            if [[ "$deployed_image" != "$image" ]]; then
              printf 'FAIL: Revision image does not match %s\n' "$image" >&2
              exit 1
            fi

            ready_revision="$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$CONTAINER_APP_RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName --output tsv)"
            if [[ "$ready_revision" == "$revision" ]]; then
              logs="$(az containerapp logs show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$CONTAINER_APP_RESOURCE_GROUP" \
                --revision "$revision" \
                --container "$CONTAINER_APP_NAME" \
                --type console --tail 100 --format text)"
              if [[ "$logs" == *"[startup] PASS: Smoke tests completed; DAB remains running"* ]]; then
                printf 'PASS: Deployed %s to healthy revision %s; SQL startup smoke test passed\n' "$image" "$revision"
                exit 0
              fi
              printf 'Waiting for the new revision SQL startup smoke-test success marker\n'
            fi
          fi

          sleep 10
        done

        printf 'FAIL: Revision %s did not become ready with a successful SQL startup smoke test within the polling window\n' "$revision" >&2
        exit 1
    env:
      ACR_LOGIN_SERVER: $(acrLoginServer)
      CONTAINER_APP_NAME: $(containerAppName)
      CONTAINER_APP_RESOURCE_GROUP: $(containerAppResourceGroup)
